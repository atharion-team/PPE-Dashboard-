<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapshots Gallery – Atharion</title>
    <style>
        body {
            background-color: #181818;
            color: #c7c7c7;
            font-family: 'Montserrat', sans-serif;
            padding: 20px;
        }
        h1 {
            color: #f0f6fc;
            margin-bottom: 20px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 16px;
        }
        .gallery img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            border: 1px solid #333;
            transition: transform 0.2s;
        }
        .gallery img:hover {
            transform: scale(1.02);
            border-color: #666;
        }
        .no-snapshots {
            text-align: center;
            padding: 40px;
            color: #6e7681;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>📸 Snapshots Gallery</h1>
    <div class="gallery">
        {% if snapshots %}
            {% for snap in snapshots %}
                <img src="{{ url_for('static', filename='snapshots/' + snap) }}" alt="Snapshot {{ loop.index }}">
            {% endfor %}
        {% else %}
            <div class="no-snapshots">No snapshots available. Process a video to generate snapshots.</div>
        {% endif %}
    </div>
</body>
</html>
